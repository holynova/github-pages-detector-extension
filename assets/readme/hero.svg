<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">GitHub Pages Detector — 打开仓库页，一眼看到它的 Pages 站</title>
  <desc id="desc">GitHub 浅色底标题：GitHub Pages Detector；右侧是模拟的仓库页眉，Public 徽章旁注入了带绿点的 GitHub Pages 打开按钮与 Copy 按钮，下方是工具栏图标的默认、已找到、出错三种状态。</desc>

  <rect width="1200" height="360" rx="26" fill="#f6f8fa"/>
  <g><rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#d0d7de" stroke-width="1.5"/></g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#0969da">CHROME 扩展 · MV3 · DEVELOPER TOOLS</text>
    <text x="56" y="122" font-size="40" font-weight="700" fill="#24292f">GitHub Pages Detector</text>
    <text x="56" y="168" font-size="23" fill="#24292f">打开仓库页，一眼看到它的 Pages 站</text>
    <text x="56" y="204" font-size="19" fill="#57606a">API 先查，URL 再验；有站就给打开与复制按钮。</text>
    <g id="chips" font-size="18" fill="#24292f" text-anchor="middle">
      <g><rect x="56" y="238" width="104" height="36" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="108" y="262">零依赖</text></g>
      <g><rect x="172" y="238" width="104" height="36" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="224" y="262">MV3</text></g>
      <g><rect x="288" y="238" width="132" height="36" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="354" y="262">可选 Token</text></g>
      <g><rect x="432" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="507" y="262">仅 storage 权限</text></g>
    </g>
  </g>

  <g id="repo-mock" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="repo-card">
      <rect x="700" y="56" width="444" height="176" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
      <text x="728" y="96" font-size="20" fill="#0969da">holynova / github-pages-detector-extension</text>
      <g><rect x="728" y="112" width="64" height="26" rx="13" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="760" y="130" font-size="16" fill="#57606a" text-anchor="middle">Public</text></g>
      <g id="pages-btn">
        <rect x="728" y="158" width="196" height="44" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
        <circle cx="754" cy="180" r="8" fill="#2da44e"/>
        <text x="772" y="187" font-size="19" font-weight="600" fill="#24292f">GitHub Pages</text>
      </g>
      <g id="copy-btn">
        <rect x="936" y="158" width="76" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="974" y="187" font-size="19" fill="#24292f" text-anchor="middle">Copy</text>
      </g>
    </g>
    <g id="icon-states" font-size="18" fill="#57606a" text-anchor="middle">
      <g>
        <rect x="700" y="256" width="136" height="52" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <circle cx="728" cy="282" r="10" fill="#8c959f"/>
        <text x="788" y="288" fill="#24292f">默认</text>
      </g>
      <g>
        <rect x="848" y="256" width="136" height="52" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <circle cx="876" cy="282" r="10" fill="#2da44e"/>
        <text x="932" y="288" fill="#24292f">已找到 ON</text>
      </g>
      <g>
        <rect x="996" y="256" width="148" height="52" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
        <circle cx="1024" cy="282" r="10" fill="#bf8700"/>
        <text x="1084" y="288" fill="#24292f">检测失败 !</text>
      </g>
    </g>
  </g>
</svg>
